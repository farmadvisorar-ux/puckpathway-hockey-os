<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Ice Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Filter for Cyber Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield Crest -->
  <polygon points="256,16 464,88 464,320 256,496 48,320 48,88" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Inner Cyan Accent Shield -->
  <polygon points="256,36 444,102 444,308 256,468 68,308 68,102" fill="none" stroke="url(#cyanGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Tactical Draft Coordinate Grid Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <line x1="100" y1="160" x2="412" y2="160" />
    <line x1="100" y1="230" x2="412" y2="230" />
    <line x1="100" y1="300" x2="412" y2="300" />
    <line x1="160" y1="100" x2="160" y2="360" />
    <line x1="256" y1="60" x2="256" y2="400" />
    <line x1="352" y1="100" x2="352" y2="360" />
  </g>

  <!-- Crossed Pro Hockey Sticks -->
  <g stroke="url(#cyanGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Stick 1: Top-Left to Bottom-Right -->
    <path d="M 140,110 L 330,340 L 380,330" fill="none" stroke-width="14" />
    <path d="M 330,340 L 380,330" fill="none" stroke="#60a5fa" stroke-width="18" />
    <!-- Stick 2: Top-Right to Bottom-Left -->
    <path d="M 372,110 L 182,340 L 132,330" fill="none" stroke-width="14" />
    <path d="M 182,340 L 132,330" fill="none" stroke="#60a5fa" stroke-width="18" />
  </g>

  <!-- Center Metallic Puck with Glowing Cyan Rim -->
  <circle cx="256" cy="225" r="48" fill="#090e17" stroke="#38bdf8" stroke-width="5" filter="url(#glow)" />
  <circle cx="256" cy="225" r="40" fill="#020617" stroke="#1e293b" stroke-width="3" />
  
  <!-- Stylized "DL" Monogram in Puck Center -->
  <text x="256" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    DL
  </text>

  <!-- Glowing Laser Faceoff Dots -->
  <circle cx="256" cy="115" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="256" cy="335" r="5" fill="#38bdf8" filter="url(#glow)" />

  <!-- DRAFTLINEUP Banner Ribbon -->
  <rect x="96" y="380" width="320" height="48" rx="10" fill="#020617" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glow)" />
  <text x="256" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    DRAFTLINEUP
  </text>
  <text x="382" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">
    .COM
  </text>
</svg>
